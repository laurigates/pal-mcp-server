name: Simulator

# Real MCP traffic over stdio: the only suite that would show a wire-level
# regression (issue #117). It runs in two tiers, because measurement (#143)
# showed the model is ~97% of the runtime and 0% of the assertions -- the
# scenarios check threading, file handling and the JSON-RPC boundary, and none
# of them asserts on what a reply says:
#
#   stub     21s     no model at all, runs on every PR
#   ollama   12m     llama3.2:1b, ~25m in CI with a cold pull
#
#   (smollm2:135m does the same work in 2m42s if the ollama tier ever needs to
#   be cheaper; llama3.2:1b is kept here for being a more ordinary chat model.)
#
# The split means the tier a contributor waits on costs seconds and pulls
# nothing from the network, while the tier that talks to a real provider runs
# where nobody's merge is blocked on it.

on:
  pull_request:
    branches: [main]
  # Same reasoning as test.yml: main is otherwise never built, so a tree broken
  # at merge time would first show up on an unrelated PR.
  push:
    branches: [main]
  schedule:
    # 03:17 UTC: off the hour, since the whole fleet fires at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The merge gate. Seconds, no secrets, no network, nothing to cache -- cheap
  # enough to require on every PR, which the ollama tier is not.
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CUSTOM_API_URL: http://localhost:11500/v1
      CUSTOM_MODELS_CONFIG_PATH: simulator_tests/conf/stub_models.json
      SIMULATOR_MODEL: ci-local
      DEFAULT_MODEL: ci-local
      # Several scenarios validate behaviour by reading the server's own debug
      # logs, so this is load-bearing, not diagnostics.
      LOG_LEVEL: DEBUG

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Keep in step with [tool.uv] required-version in pyproject.toml, the
          # other workflows, and the uv base image in Dockerfile.
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.x"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Start the stub provider
        run: |
          nohup uv run python -m simulator_tests.stub_provider --port 11500 \
            > "$RUNNER_TEMP/stub.log" 2>&1 &
          for _ in $(seq 30); do
            if curl -sf "$CUSTOM_API_URL/models" > /dev/null; then
              echo "Stub provider is serving"
              exit 0
            fi
            sleep 1
          done
          echo "Stub provider did not start within 30s" >&2
          cat "$RUNNER_TEMP/stub.log" >&2
          exit 1

      - name: Run the provider-agnostic simulator scenarios
        run: uv run python communication_simulator_test.py --ci

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs-stub
          path: |
            logs/
            ${{ runner.temp }}/stub.log
          if-no-files-found: warn
          retention-days: 7

  # The honest one: a real OpenAI-compatible server, so the request PAL builds
  # has to be acceptable to something we did not write. Not run on PRs, where
  # its ~25 minutes would be merge latency -- except on a PR labelled
  # `simulator-full`, for changes to the provider or transport layer.
  ollama:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'simulator-full')
    runs-on: ubuntu-latest
    # A CPU-served 1B model is slow but bounded; the cap is there to kill a hung
    # session rather than to be a realistic budget.
    timeout-minutes: 45

    env:
      # Ollama's OpenAI-compatible endpoint. The trailing /v1 matters: the
      # Custom provider passes this straight to the OpenAI client.
      CUSTOM_API_URL: http://localhost:11434/v1
      # Kept out of conf/ so scripts/audit_model_registry.py -- which audits
      # conf/*_models.json against live provider catalogs -- never sees a model
      # that exists only inside this job.
      CUSTOM_MODELS_CONFIG_PATH: simulator_tests/conf/ci_custom_models.json
      SIMULATOR_MODEL: ci-local
      DEFAULT_MODEL: ci-local
      OLLAMA_MODEL: llama3.2:1b
      LOG_LEVEL: DEBUG

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.x"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Cache the Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          # The installer registers a systemd unit that runs as the `ollama`
          # user, whose model directory is /usr/share/ollama/.ollama -- not the
          # path cached above, and not writable by the runner. Stopping it means
          # the server below is ours: same user, same HOME, same cache.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          # Poll rather than sleep: the server is usually up in about a second,
          # and a fixed sleep would be either wasteful or flaky.
          for _ in $(seq 60); do
            if curl -sf http://localhost:11434/v1/models > /dev/null; then
              echo "Ollama is serving"
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not start within 60s" >&2
          cat "$RUNNER_TEMP/ollama.log" >&2
          exit 1

      - name: Pull the model
        run: ollama pull "$OLLAMA_MODEL"

      - name: Run the provider-agnostic simulator scenarios
        # Not --verbose: it sets the root logger to DEBUG, which buries the
        # scenario reporting under httpx/httpcore chatter. The same detail is in
        # the logs uploaded below, where it is readable.
        run: uv run python communication_simulator_test.py --ci

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs-ollama
          path: |
            logs/
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
          retention-days: 7
