name: "Release: release-please"

on:
  push:
    branches:
      - main
  # Allow manual triggering, e.g. after a stale release PR is closed.
  workflow_dispatch: {}

# Concurrency lives in the reusable workflow (group release-please-<repo>,
# cancel-in-progress: false). Declaring the same group here would have this run
# hold the group while the workflow it calls queues behind it.

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: laurigates/.github/.github/workflows/reusable-release-please.yml@main
    with:
      # gitops provisions the numeric App ID; the reusable workflow forwards it
      # to create-github-app-token, which accepts it as the JWT issuer.
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  # Build and publish to PyPI only when release-please cut an actual release.
  # The reusable workflow deliberately has no publish step, so this stays in the
  # caller: uv-native build, then the canonical PyPA publish action.
  #
  # Publishes via PyPI trusted publishing (OIDC) -- no long-lived token to
  # rotate or leak, and publishing is scoped to this workflow in this repo.
  # This requires a matching publisher registered on PyPI; without it the
  # exchange fails at the publish step. See issue #79.
  #
  # This previously passed `password: ${{ secrets.PYPI_API_TOKEN }}` for a
  # secret that was never created. An empty password makes the action fall
  # back to OIDC, which then failed for want of id-token: write -- so the
  # error named the permission and hid the missing credential behind it, and
  # the job failed on all five releases from 10.2.2 to 10.4.2 without anyone
  # noticing, because the tag and GitHub release are cut by a different job.
  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for trusted publishing: lets the job mint the OIDC token
      # PyPI exchanges for a short-lived upload credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          # Keep in step with [tool.uv] required-version in pyproject.toml and
          # the uv base image in Dockerfile — three places, not two.
          # Renovate's github-actions manager reads this `version:` natively (as
          # astral-sh/uv); renovate.json disables that package, so the bump is manual.
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
          enable-cache: true

      - name: Build distributions
        run: uv build

      # No `password:` -- omitting it is what selects trusted publishing.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # One-time tombstone for the old PyPI name (issue #95). The package moved to
  # palaver-mcp-server at 13.0.0; this publishes pal-mcp-server 13.0.0, a shim
  # that depends on palaver-mcp-server>=13.0.0 and keeps the `pal-mcp-server`
  # command (packaging/pal-mcp-server-tombstone/). It runs only for v13.0.0,
  # and only after publish-pypi succeeds, so a failed palaver upload cannot
  # leave a shim on PyPI that depends on a package that does not exist.
  #
  # Trusted publishing matches on repo name and workflow filename, so the
  # pal-mcp-server publisher on PyPI must name the renamed repo before this
  # runs. Delete this job and the packaging directory after 13.0.0 ships;
  # tests/test_tombstone_package.py fails once the version passes 13.0.0 while
  # either still exists.
  publish-tombstone:
    needs: [release-please, publish-pypi]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name == 'v13.0.0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          # Keep in step with [tool.uv] required-version in pyproject.toml and
          # the uv base image in Dockerfile — three places, not two.
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
          enable-cache: true

      - name: Build tombstone distributions
        run: uv build packaging/pal-mcp-server-tombstone --out-dir dist-tombstone

      - name: Publish tombstone to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-tombstone/

  # Claude Desktop extension bundle (.mcpb), attached to the GitHub release.
  # Built from the release tag so it matches the PyPI package of the same
  # version; release-please bumps manifest.json via extra-files. Releases here
  # are not immutable, so the asset can be added after the release is published.
  mcpb:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          # Keep in step with [tool.uv] required-version in pyproject.toml and
          # the uv base image in Dockerfile — three places, not two.
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.4"
          enable-cache: true

      - name: Build and smoke-test MCPB bundle
        run: uv run python scripts/build_mcpb.py && uv run python scripts/smoke_mcpb.py

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.mcpb --clobber
