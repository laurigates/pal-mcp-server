name: "Release: release-please"

on:
  push:
    branches:
      - main
  # Allow manual triggering, e.g. after a stale release PR is closed.
  workflow_dispatch: {}

# Concurrency lives in the reusable workflow (group release-please-<repo>,
# cancel-in-progress: false). Declaring the same group here would have this run
# hold the group while the workflow it calls queues behind it.

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: laurigates/.github/.github/workflows/reusable-release-please.yml@main
    with:
      # gitops provisions the numeric App ID; the reusable workflow forwards it
      # to create-github-app-token, which accepts it as the JWT issuer.
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  # Build and publish to PyPI only when release-please cut an actual release.
  # The reusable workflow deliberately has no publish step, so this stays in the
  # caller: uv-native build, then the canonical PyPA publish action.
  #
  # Publishes via PyPI trusted publishing (OIDC) -- no long-lived token to
  # rotate or leak, and publishing is scoped to this workflow in this repo.
  # This requires a matching publisher registered on PyPI; without it the
  # exchange fails at the publish step. See issue #79.
  #
  # This previously passed `password: ${{ secrets.PYPI_API_TOKEN }}` for a
  # secret that was never created. An empty password makes the action fall
  # back to OIDC, which then failed for want of id-token: write -- so the
  # error named the permission and hid the missing credential behind it, and
  # the job failed on all five releases from 10.2.2 to 10.4.2 without anyone
  # noticing, because the tag and GitHub release are cut by a different job.
  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for trusted publishing: lets the job mint the OIDC token
      # PyPI exchanges for a short-lived upload credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Keep in step with [tool.uv] required-version in pyproject.toml and
          # the uv base image in Dockerfile — three places, not two.
          # The annotation below is inert unless the org Renovate config enables a
          # matching customManager; assume this bump is manual.
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.12.x"
          enable-cache: true

      - name: Build distributions
        run: uv build

      # No `password:` -- omitting it is what selects trusted publishing.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
